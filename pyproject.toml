[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "system-one-projects"
version = "0.1.0"
description = "Monorepo for System One AI decision models (TypeSafe Jev, Cloudflare Clef) applications and services"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["projects/email-triage/tests"]
norecursedirs = ["email-triage", ".git", ".venv", "__pycache__"]
